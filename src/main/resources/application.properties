spring.application.name=rag-ollama
chat-model.baseUrl=http://localhost:11434

# Spring JDBC DataSource used by JdbcTemplate (for example, the ingestion log).
# These defaults match the local Docker setup in POSTGRES_PGADMIN_SETUP.md.
# Override DB_URL, DB_USERNAME, and DB_PASSWORD for another environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/vectordb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

